  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-hover: #79b8ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 2.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
    }
    h1 a { color: var(--accent); text-decoration: none; }
    h1 a:hover { color: var(--accent-hover); }
    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }
    .count {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: 0.25rem 0.9rem;
      font-size: 0.85rem;
      margin-top: 0.8rem;
      color: var(--muted);
    }
    ul {
      list-style: none;
      display: grid;
      gap: 0.5rem;
    }
    li {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.7rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 1rem;
      transition: border-color 0.15s;
    }
    li:hover { border-color: var(--accent); }
    .repo-name {
      font-weight: 600;
      color: var(--accent);
      text-decoration: none;
      flex: 1;
      min-width: 140px;
    }
    .repo-name:hover { text-decoration: underline; color: var(--accent-hover); }
    .links a {
      font-size: 0.85rem;
      color: var(--muted);
      text-decoration: none;
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      border: 1px solid transparent;
    }
    .links a:hover {
      color: var(--text);
      background: #21262d;
      border-color: var(--border);
    }
    footer {
      margin-top: 3rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); text-decoration: none; }
  </style>
